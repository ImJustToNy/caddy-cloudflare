name: build

on:
  schedule:
    - cron: "17 4 * * *" # daily; builds only when there is a new Caddy release, plus a weekly base refresh on Sundays
  workflow_dispatch:
    inputs:
      force:
        description: Build even if this Caddy version is already published
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  id-token: write # Sigstore signing for the provenance attestation
  attestations: write

env:
  IMAGE: ghcr.io/imjusttony/caddy-cloudflare

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve latest Caddy release
        id: caddy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -r tag published < <(gh api repos/caddyserver/caddy/releases/latest --jq '"\(.tag_name) \(.published_at)"') # /latest excludes pre-releases
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "published=$published" >> "$GITHUB_OUTPUT"
          echo "Latest Caddy: $tag ($published)"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether to build
        id: decide
        env:
          VERSION: ${{ steps.caddy.outputs.version }}
          PUBLISHED: ${{ steps.caddy.outputs.published }}
          FORCE: ${{ inputs.force }}
          BASE_WAIT_DAYS: 7
        run: |
          # The official caddy image is published through docker-library/official-images,
          # usually hours to a few days after the GitHub release. Until both base tags exist,
          # skip quietly; fail only if they are still missing after BASE_WAIT_DAYS.
          for tag in "$VERSION-builder-alpine" "$VERSION-alpine"; do
            if ! docker manifest inspect "caddy:$tag" >/dev/null 2>&1; then
              age_days=$(( ($(date -u +%s) - $(date -u -d "$PUBLISHED" +%s)) / 86400 ))
              if [ "$age_days" -ge "$BASE_WAIT_DAYS" ]; then
                echo "::error::caddy:$tag still not on Docker Hub ${age_days} days after the release"
                exit 1
              fi
              echo "::notice::caddy:$tag not on Docker Hub yet (release is ${age_days} days old), waiting"
              echo "build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          if [ "$FORCE" = "true" ]; then
            reason=forced
          elif [ "$(date -u +%u)" = "7" ]; then
            reason=weekly-base-image-refresh
          elif ! docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            reason=new-caddy-release
          else
            reason=
          fi
          echo "build=$([ -n "$reason" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Caddy $VERSION: ${reason:-already published, nothing to do}"

      - name: Check out
        if: steps.decide.outputs.build == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        if: steps.decide.outputs.build == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push
        id: build
        if: steps.decide.outputs.build == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          pull: true
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            CADDY_VERSION=${{ steps.caddy.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.caddy.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=caddy-cloudflare
            org.opencontainers.image.description=Caddy ${{ steps.caddy.outputs.version }} with caddy-dns/cloudflare
            org.opencontainers.image.version=${{ steps.caddy.outputs.version }}

      - name: Attest build provenance
        if: steps.decide.outputs.build == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
